name: Förderkalender aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [main]
    paths:
      - 'calls.csv'
      - 'generate.py'
      - '.github/workflows/calendar.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kalender generieren
        run: python generate.py
      - name: Kalenderdatei veröffentlichen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f foerderradar.ics
          if ! git diff --cached --quiet; then
            git commit -m 'Kalender aktualisieren'
            git push
          fi
