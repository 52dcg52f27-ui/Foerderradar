
name: Förderkalender aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [main]
    paths:
      - 'calls.csv'
      - 'generate.py'
      - 'research.py'
      - '.github/workflows/calendar.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Dateien laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Recherche ausführen
        env:
          TEST_MODE: "0"
        run: python research.py

     
      - name: CSV dauerhaft speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calls.csv

          if ! git diff --cached --quiet; then
            git commit -m "Förderradar: Ausschreibungen aktualisieren"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Keine Änderungen vorhanden."
          fi


      - name: Kalender erstellen
        run: python generate.py

      - name: Website vorbereiten
        run: |
          mkdir -p _site
          cp foerderradar.ics _site/foerderradar.ics
          echo '<h1>Förderradar</h1><p><a href="foerderradar.ics">Kalender abonnieren</a></p>' > _site/index.html

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Dateien hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
